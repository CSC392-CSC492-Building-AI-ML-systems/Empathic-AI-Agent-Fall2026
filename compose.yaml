services:
  db:
    image: postgres:18.6-alpine
    container_name: postgres
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: migrate
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    command: python -m src.database.migrate
    depends_on:
      db:
        condition: service_healthy

  test-db:
    profiles: [test]
    image: postgres:18.6-alpine
    env_file: .env
    environment:
      POSTGRES_DB: postgres_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    profiles: [test]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    env_file: .env
    environment:
      DB_HOST: test-db
      DB_PORT: 5432
      POSTGRES_DB: postgres_test
    command: sh -c "python -m src.database.migrate && python -m pytest -q -p no:cacheprovider src/tests"
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
